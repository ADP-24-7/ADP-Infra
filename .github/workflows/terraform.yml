name: Terraform checks

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tf.example"
      - "**/*.hcl.example"
      - "compose.yaml"
      - "Makefile"
      - "README.md"
      - "docs/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.tf"
      - "**/*.tf.example"
      - "**/*.hcl.example"
      - "compose.yaml"
      - "Makefile"
      - "README.md"
      - "docs/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting and validate configuration
        run: make check
